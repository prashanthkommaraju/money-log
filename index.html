<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10213A">
<title>Prashanth Money log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#10213a;--mute:#66758c;--line:#dde3ec;--track:#e6ebf3;--hero:#10213a;--acc:#f4b400;--btn:#10213a;--btntext:#fff;--ok:#1f9d8b;--warn:#e8a100;--bad:#e4572e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0b1220;--card:#131d31;--ink:#e9eef7;--mute:#8c9bb3;--line:#223049;--track:#1d2a42;--hero:#1a2a48;--btn:#f4b400;--btntext:#10213a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 110px}
h1{font-size:1.25rem;margin:0;font-weight:800}
h2{font-size:1rem;margin:0 0 12px;font-weight:700}
button,input,select{font:inherit;color:inherit}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:3px;font-weight:600}
button{cursor:pointer}
.btn{padding:12px 18px;border:0;border-radius:10px;background:var(--btn);color:var(--btntext);font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:14px;border:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.nav{display:flex;align-items:center;gap:4px}
.nav button{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);font-size:1.3rem;line-height:1;border:1px solid var(--line)}
.nav .m{min-width:150px;text-align:center;font-weight:700}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:20px;display:grid;gap:18px}
@media(min-width:640px){.hero{grid-template-columns:1fr 190px;align-items:center}}
.hero .lbl{color:#a9b8d0;font-weight:600}
.hero .tot{font-size:2.8rem;font-weight:800;line-height:1.1;margin:2px 0 8px}
.chip-d{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);font-size:.85rem;font-weight:600}
.donut{width:100%;max-width:190px;margin:0 auto;display:block}
.legend{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px}
.lg{display:flex;align-items:center;gap:8px;font-size:.92rem;padding:3px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .pc{color:#a9b8d0;width:38px;text-align:right}
.brow{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 0}
.brow .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.brow .s{color:var(--mute);font-size:.85rem;font-weight:500}
.prog{height:10px;border-radius:99px;background:var(--track);margin:6px 0 3px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px}
.link{background:none;border:0;color:var(--ink);font-weight:700;text-decoration:underline;padding:6px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tfoot td{font-weight:700}
summary{cursor:pointer;font-weight:700}
.entry{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border:0}
.entry .n{flex:1;min-width:0}
.entry .n small{color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .d{color:var(--mute);font-size:.85rem;width:52px;flex:none}
.entry .x{background:none;border:0;color:var(--mute);width:36px;height:36px;border-radius:50%;font-size:1rem}
.empty{color:var(--mute);margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:max(20px,env(safe-area-inset-bottom));height:60px;padding:0 24px 0 20px;border-radius:30px;border:0;background:var(--acc);color:#10213a;font-weight:800;font-size:1.05rem;box-shadow:0 6px 20px rgba(0,0,0,.28);display:flex;align-items:center;gap:8px}
.fab b{font-size:1.7rem;line-height:1;font-weight:600}
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:100%;max-width:520px;margin:auto auto 0;border-radius:22px 22px 0 0}
dialog::backdrop{background:rgba(8,14,26,.55)}
@media(min-width:640px){dialog{margin:auto;border-radius:22px}}
.sheet{padding:20px 18px max(20px,env(safe-area-inset-bottom))}
.amt{display:flex;align-items:center;gap:6px;font-size:2.6rem;font-weight:800}
.amt input{font-size:2.6rem;font-weight:800;border:0;background:none;padding:0;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:.92rem}
.chip.on{background:var(--btn);color:var(--btntext);border-color:var(--btn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.msg{margin:8px 0 0;min-height:1.2em;color:var(--mute)}
.err{color:var(--bad);font-weight:600}
.note{background:var(--track);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--mute)}
body.auth{background:#10213a}
.login{max-width:440px;margin:18px auto;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.4)}
.login svg{display:block;width:100%;height:auto;max-height:300px}
.logbody{padding:20px 20px 26px}
.brand{font-size:1.75rem;font-weight:800;line-height:1.15}
.tag{color:var(--mute);margin:4px 0 18px}
.btn.sun{background:var(--acc);color:#10213a}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://mgdrmewrylfdceavukii.supabase.co';
const SB_KEY='sb_publishable_-S5LsQ-UT8KQ_zBUoELzDA_aCxZ2Vgz';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const DEFAULT_CATS=['Rent / EMI','Groceries','Food & dining','Transport','Utilities','Shopping','Health','Investments','Entertainment','Education','Other'];
const PAL=['#f4b400','#2ec4b6','#ff7a59','#8e7cff','#4da3ff','#b8e05a','#ff8fb1','#c2a57a','#9aa9bd','#5fd38d','#e36bd9'];
const inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);
const compact=n=>'₹'+new Intl.NumberFormat('en-IN',{notation:'compact',maximumFractionDigits:1}).format(n);
const today=()=>new Date().toISOString().slice(0,10);
const mkey=d=>d.slice(0,7);
const mlabel=k=>new Date(k+'-01T00:00:00').toLocaleString('en-IN',{month:'long',year:'numeric'});
const mshort=k=>new Date(k+'-01T00:00:00').toLocaleString('en-IN',{month:'short'});
const shift=(k,n)=>{const d=new Date(k+'-01T00:00:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fromRow=r=>({id:r.id,date:r.date,cat:r.category,amt:Number(r.amount),note:r.note||''});
let entries=[],budgets={},budgetsOk=true,cur=mkey(today()),user=null,CATS=[],pick='';
const color=c=>PAL[Math.max(0,CATS.indexOf(c))%PAL.length];
const sumBy=f=>entries.filter(f).reduce((s,e)=>s+e.amt,0);

/* ---------- auth ---------- */
function authMsg(m,bad){const e=$('authmsg');e.textContent=m||'';e.className='msg'+(bad?' err':'')}
async function creds(fn){
  const email=$('email').value.trim(),password=$('pass').value;
  if(!email||password.length<6){authMsg('Enter your email and a password of at least 6 characters.',true);return}
  authMsg('Working…');
  const {data,error}=await fn({email,password});
  if(error){authMsg(error.message,true);return}
  if(!data.session)authMsg('Account created. Check your email to confirm it, then sign in.');
}
$('signin').onclick=()=>creds(c=>sb.auth.signInWithPassword(c));
$('signup').onclick=()=>creds(c=>sb.auth.signUp(c));
$('signout').onclick=()=>sb.auth.signOut();
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('signin').click()});
sb.auth.onAuthStateChange((_e,s)=>{
  user=s?s.user:null;
  $('auth').hidden=!!user;$('app').hidden=!user;document.body.classList.toggle('auth',!user);
  if(user){$('who').textContent='Signed in as '+user.email+'. Your entries sync across your devices.';load()}
  else{entries=[];budgets={};authMsg('')}
});
sb.auth.getSession().then(({data})=>{if(!data.session)$('auth').hidden=false});

/* ---------- data ---------- */
async function load(){
  const [a,b]=await Promise.all([
    sb.from('expenses').select('*').order('date',{ascending:false}),
    sb.from('budgets').select('*')
  ]);
  if(a.error){alert('Could not load entries: '+a.error.message);return}
  entries=a.data.map(fromRow);
  budgetsOk=!b.error;budgets={};
  if(b.data)b.data.forEach(r=>budgets[r.category]=Number(r.monthly_limit));
  render();
}

/* ---------- render ---------- */
function render(){
  const set=new Set(DEFAULT_CATS);entries.forEach(e=>set.add(e.cat));Object.keys(budgets).forEach(c=>set.add(c));CATS=[...set];
  $('mlabel').textContent=mlabel(cur);
  const mine=entries.filter(e=>mkey(e.date)===cur).sort((a,b)=>b.date.localeCompare(a.date));
  const total=mine.reduce((s,e)=>s+e.amt,0);
  const prevTotal=sumBy(e=>mkey(e.date)===shift(cur,-1));
  $('hlabel').textContent='Spent in '+mshort(cur);
  $('total').textContent=inr(total);
  $('delta').textContent=prevTotal?(total>=prevTotal?'▲ ':'▼ ')+Math.round(Math.abs(total-prevTotal)/prevTotal*100)+'% vs '+mshort(shift(cur,-1)):'No spending logged last month';

  const by={};mine.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);

  // donut
  let off=25,svg='<svg viewBox="0 0 42 42" class="donut" role="img" aria-label="Spending by category"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/>';
  rows.forEach(([c,v])=>{const p=v/total*100;svg+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${color(c)}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p});
  svg+=`<text x="21" y="23" text-anchor="middle" font-size="5.2" font-weight="800" fill="#fff">${total?compact(total):'₹0'}</text></svg>`;
  $('donut').innerHTML=svg;
  $('legend').innerHTML=rows.length?rows.map(([c,v])=>`<div class="lg"><span class="dot" style="background:${color(c)}"></span><span class="nm">${esc(c)}</span><b>${inr(v)}</b><span class="pc">${Math.round(v/total*100)}%</span></div>`).join(''):'<div class="lg" style="color:#a9b8d0">Nothing logged yet. Tap Add to start.</div>';

  // budgets
  const bcats=[...new Set([...Object.keys(budgets),...Object.keys(by)])];
  let bh=budgetsOk?'':'<div class="note">Budgets need one extra database table. Run the budgets SQL in Supabase, then reload.</div>';
  if(budgetsOk){
    bcats.sort((a,b)=>((by[b]||0)/(budgets[b]||Infinity))-((by[a]||0)/(budgets[a]||Infinity))||(by[b]||0)-(by[a]||0));
    bh=bcats.map(c=>{
      const sp=by[c]||0,lim=budgets[c];
      if(!lim)return `<button class="brow" data-b="${esc(c)}"><div class="t"><span>${esc(c)}</span><span>${inr(sp)}</span></div><div class="s">No budget · tap to set one</div></button>`;
      const p=sp/lim,col=p>1?'var(--bad)':p>=.8?'var(--warn)':'var(--ok)';
      return `<button class="brow" data-b="${esc(c)}"><div class="t"><span>${esc(c)}</span><span>${inr(sp)} <span class="s">of ${inr(lim)}</span></span></div><div class="prog"><i style="width:${Math.min(100,p*100)}%;background:${col}"></i></div><div class="s">${p>1?'Over by '+inr(sp-lim):inr(lim-sp)+' left'}</div></button>`;
    }).join('')||'<p class="empty">Set a monthly limit for any category to track it here.</p>';
    bh+='<button class="link" data-b="">+ Add a budget</button>';
  }
  $('budgets').innerHTML=bh;

  // trend
  const ms=[];for(let i=5;i>=0;i--)ms.push(shift(cur,-i));
  const vals=ms.map(m=>sumBy(e=>mkey(e.date)===m)),mx=Math.max(...vals,1);
  let t='<svg viewBox="0 0 320 130" width="100%" role="img" aria-label="Spending over the last 6 months">';
  ms.forEach((m,i)=>{
    const step=320/6,x=i*step+(step-34)/2,h=vals[i]/mx*78,y=98-h,on=m===cur;
    t+=`<g data-m="${m}" style="cursor:pointer"><rect x="${x}" y="${y}" width="34" height="${Math.max(h,2)}" rx="6" fill="${on?'var(--acc)':'var(--track)'}"/><text x="${x+17}" y="${y-5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)">${vals[i]?compact(vals[i]):''}</text><text x="${x+17}" y="116" text-anchor="middle" font-size="10.5" font-weight="${on?800:500}" fill="var(--mute)">${mshort(m)}</text><rect x="${i*step}" y="0" width="${step}" height="130" fill="transparent"/></g>`;
  });
  $('trend').innerHTML=t+'</svg>';

  // matrix
  const mm=[];for(let i=11;i>=0;i--)mm.push(shift(cur,-i));
  const used=CATS.filter(c=>entries.some(e=>e.cat===c));
  $('matrix').innerHTML=used.length?'<table><thead><tr><th>Category</th>'+mm.map(m=>`<th>${mshort(m)}</th>`).join('')+'</tr></thead><tbody>'+used.map(c=>`<tr><td>${esc(c)}</td>`+mm.map(m=>{const v=sumBy(e=>e.cat===c&&mkey(e.date)===m);return `<td>${v?inr(v):'–'}</td>`}).join('')+'</tr>').join('')+'</tbody><tfoot><tr><td>Total</td>'+mm.map(m=>`<td>${inr(sumBy(e=>mkey(e.date)===m))}</td>`).join('')+'</tr></tfoot></table>':'<p class="empty">Your month-by-category table will appear here.</p>';

  // entries
  $('list').innerHTML=mine.length?mine.map(e=>`<div class="entry"><span class="dot" style="background:${color(e.cat)}"></span><span class="n">${esc(e.cat)}${e.note?`<small>${esc(e.note)}</small>`:''}</span><span class="d">${new Date(e.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span><b>${inr(e.amt)}</b><button class="x" data-id="${e.id}" aria-label="Delete entry">✕</button></div>`).join(''):'<p class="empty">No entries in '+mlabel(cur)+'.</p>';
}
$('prev').onclick=()=>{cur=shift(cur,-1);render()};
$('next').onclick=()=>{cur=shift(cur,1);render()};
$('trend').onclick=e=>{const g=e.target.closest('[data-m]');if(g){cur=g.dataset.m;render()}};

/* ---------- quick add ---------- */
function drawChips(){
  const cnt={};entries.forEach(e=>cnt[e.cat]=(cnt[e.cat]||0)+1);
  const order=[...CATS].sort((a,b)=>(cnt[b]||0)-(cnt[a]||0));
  $('chips').innerHTML=order.map(c=>`<button class="chip${c===pick?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}
$('fab').onclick=()=>{
  pick='';$('amt').value='';$('note').value='';$('newcat').value='';$('err').textContent='';$('date').value=today();
  drawChips();$('sheet').showModal();setTimeout(()=>$('amt').focus(),50);
};
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;pick=b.dataset.c;$('newcat').value='';drawChips()};
$('newcat').oninput=e=>{pick=e.target.value.trim();drawChips()};
$('cancel').onclick=()=>$('sheet').close();
$('save').onclick=async()=>{
  const date=$('date').value,cat=pick,amt=parseFloat($('amt').value);
  if(!(amt>0)||!cat||!date){$('err').textContent='Enter an amount, pick a category and a date.';return}
  $('save').disabled=true;
  const {data,error}=await sb.from('expenses').insert({date,category:cat,amount:amt,note:$('note').value.trim()}).select().single();
  $('save').disabled=false;
  if(error){$('err').textContent='Could not save: '+error.message;return}
  entries.push(fromRow(data));cur=mkey(date);$('sheet').close();render();
};
$('amt').addEventListener('keydown',e=>{if(e.key==='Enter')$('save').click()});
$('list').onclick=async e=>{
  const id=e.target.dataset.id;if(!id||!confirm('Delete this entry?'))return;
  const {error}=await sb.from('expenses').delete().eq('id',id);
  if(error){alert('Could not delete: '+error.message);return}
  entries=entries.filter(x=>x.id!==id);render();
};
['sheet','bdlg'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id))$(id).close()}));

/* ---------- budgets ---------- */
$('budgets').onclick=e=>{
  const b=e.target.closest('[data-b]');if(!b)return;
  const c=b.dataset.b;
  $('btitle').textContent=c?'Budget for '+c:'New budget';
  $('bcat').value=c;$('bcat').readOnly=!!c;$('blim').value=budgets[c]||'';$('berr').textContent='';
  $('bdel').hidden=!budgets[c];
  $('bcats').innerHTML=CATS.map(x=>`<option value="${esc(x)}">`).join('');
  $('bdlg').showModal();setTimeout(()=>$('blim').focus(),50);
};
$('bcancel').onclick=()=>$('bdlg').close();
$('bsave').onclick=async()=>{
  const category=$('bcat').value.trim(),lim=parseFloat($('blim').value);
  if(!category||!(lim>0)){$('berr').textContent='Enter a category and a limit above 0.';return}
  const {error}=await sb.from('budgets').upsert({category,monthly_limit:lim},{onConflict:'user_id,category'});
  if(error){$('berr').textContent='Could not save: '+error.message;return}
  budgets[category]=lim;$('bdlg').close();render();
};
$('bdel').onclick=async()=>{
  const category=$('bcat').value.trim();
  const {error}=await sb.from('budgets').delete().eq('category',category);
  if(error){$('berr').textContent='Could not remove: '+error.message;return}
  delete budgets[category];$('bdlg').close();render();
};

/* ---------- export / import ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('csv').onclick=()=>dl('money-log.csv','Date,Category,Amount,Note\n'+entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.cat,e.amt,e.note].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
$('json').onclick=()=>dl('money-log-backup.json',JSON.stringify(entries.map(({date,cat,amt,note})=>({date,cat,amt,note})),null,1),'application/json');
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const data=JSON.parse(await f.text());if(!Array.isArray(data))throw 0;
    const k=x=>[x.date,x.cat,Number(x.amt),x.note||''].join('|');
    const have=new Set(entries.map(k));
    const rows=data.filter(x=>x&&x.date&&x.cat&&Number(x.amt)>0&&!have.has(k(x))).map(x=>({date:x.date,category:x.cat,amount:Number(x.amt),note:x.note||''}));
    if(rows.length){const {error}=await sb.from('expenses').insert(rows);if(error)throw error}
    await load();
  }catch(err){alert('Could not import that file.')}
};
</script>
</body>
</html>
